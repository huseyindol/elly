spring.application.name=elly
server.port=${APP_PORT:8080}

# ============================================
# MULTI-TENANCY CONFIGURATION (Database-per-Tenant)
# ============================================
# Spring Boot auto DataSource devre dışı bırakıldı (DataSourceConfig yönetir)
# Her tenant için ayrı HikariCP connection pool oluşturulur.

# PRIMARY tenant — SADECE boot/schema icindir (routing datasource'un baslangic hedefi +
# Hibernate validate icin). REQUEST routing'i ETKILEMEZ: her istek kendi tenant'ini
# tasimak zorundadir (public URL veya JWT tenantId claim); cozulemezse TENANT_REQUIRED.
# basedb KALDIRILDI — merkezi/varsayilan DB yoktur.
app.tenants.default-tenant=${DEFAULT_TENANT:tenant1}

# --- Tenant 1 ---
app.tenants.datasources.tenant1.url=jdbc:postgresql://${TENANT1_DB_HOST:${DB_HOST:localhost}}:${TENANT1_DB_PORT:${DB_PORT:5432}}/${TENANT1_DB_NAME:elly_tenant1}
app.tenants.datasources.tenant1.username=${TENANT1_DB_USER:postgres}
app.tenants.datasources.tenant1.password=${TENANT1_DB_PASSWORD:123456}
app.tenants.datasources.tenant1.schema=${TENANT1_DB_SCHEMA:public}
app.tenants.datasources.tenant1.frontend-url=${TENANT1_FRONTEND_URL:http://localhost:3000}

# --- Tenant 2 ---
app.tenants.datasources.tenant2.url=jdbc:postgresql://${TENANT2_DB_HOST:${DB_HOST:localhost}}:${TENANT2_DB_PORT:${DB_PORT:5432}}/${TENANT2_DB_NAME:elly_tenant2}
app.tenants.datasources.tenant2.username=${TENANT2_DB_USER:postgres}
app.tenants.datasources.tenant2.password=${TENANT2_DB_PASSWORD:123456}
app.tenants.datasources.tenant2.schema=${TENANT2_DB_SCHEMA:public}
app.tenants.datasources.tenant2.frontend-url=${TENANT2_FRONTEND_URL:http://localhost:3000}

# Yeni tenant eklemek için:
# app.tenants.datasources.tenant3.url=jdbc:postgresql://...
# app.tenants.datasources.tenant3.username=...
# app.tenants.datasources.tenant3.password=...
# app.tenants.datasources.tenant3.schema=...
# app.tenants.datasources.tenant3.frontend-url=${TENANT3_FRONTEND_URL:https://...}

# ============================================
# JPA/HIBERNATE (DataSourceConfig & JpaConfig yönetir)
# ============================================
# Not: spring.datasource.* ve spring.jpa.* artık kullanılmıyor
# Tüm JPA ayarları JpaConfig.java içinde tanımlıdır.
#
# hbm2ddl.auto stratejisi (JpaConfig.java tüm tenant'lara uygular):
#   - update   : entity farklarini otomatik ALTER TABLE yapar (LOKAL)
#   - validate : sadece schema dogrular, degistirmez (PROD ONERILEN)
#   - none     : Hibernate hic dokunmaz
# Prod'da migration'lar manuel yonetilir, Hibernate'in ALTER TABLE yapmasi
# orphan constraint / beklenmedik degisikliklere yol acar.
app.jpa.ddl-auto=${JPA_DDL_AUTO:validate}
spring.docker.compose.enabled=false

# Startup seed (DB doluysa false — her tenant'a permission/rol + SUPER_ADMIN, email template)
# Ilk kurulum veya yeni permission eklendiginde bir kez true yap.
app.startup.rbac-seed=${STARTUP_RBAC_SEED:false}
app.startup.email-template-seed=${STARTUP_EMAIL_TEMPLATE_SEED:false}

# ============================================
# SWAGGER / OPENAPI
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
# Tum tag ve operation'lar varsayilan KAPALI gelsin (kullanici tek tek acar)
springdoc.swagger-ui.doc-expansion=none
# Tag'leri ve operation'lari alfabetik sirala
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ============================================
# FILE UPLOAD
# ============================================
file.upload.directory=assets/images
file.upload.directory.files=assets
# Tenant basina depolama kotasi (byte). Varsayilan 3GB; tenant override storage_quota.limit_bytes
app.storage.default-quota-bytes=3221225472
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# JWT CONFIGURATION
# ============================================
jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890}
jwt.encryption.secret=${JWT_ENCRYPTION_SECRET:myEncryptionKey123456789012345678901234567890}
# 30 dakika (milisaniye) — H2: frontend'de expiredDate cookie ile silent refresh yapılmalı
# Test için env ile kısaltılabilir: JWT_EXPIRATION=300000 (5dk)
jwt.expiration=${JWT_EXPIRATION:1800000}
# 7 gün (milisaniye) — H2: 6 aydan 7 güne indirildi
# Test için env ile kısaltılabilir: JWT_REFRESH_EXPIRATION=600000 (10dk)
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}
# 5 dakika (milisaniye) — 2FA doğrulama için kısa ömürlü MFA token süresi
jwt.mfa.expiration=300000
# 1 saat (milisaniye) — anonim guest chat token süresi
jwt.guest.expiration=${JWT_GUEST_EXPIRATION:3600000}

# ============================================
# APPLICATION CONFIGURATION
# ============================================
app.timezone=Europe/Istanbul

# ============================================
# FRONTEND URLs (verification email link'leri için)
# ============================================
# Tenant register URL'i ÖNCELİKLE per-tenant config'ten alınır:
#   app.tenants.datasources.{tid}.frontend-url (TENANT{n}_FRONTEND_URL env)
# Her tenant kendi domain'inde register olduğu için per-tenant tek doğru çözüm.
# Aşağıdaki global fallback yalnız per-tenant değer yoksa kullanılır (geriye dönük güvenlik).
app.frontend-url.tenant=${TENANT_FRONTEND_URL:http://localhost:3000}
# Admin panel (SUPER_ADMIN tarafından create edilen admin user verification mail link'i)
app.frontend-url.panel=${PANEL_FRONTEND_URL:http://localhost:3001}

# ============================================
# COOKIE CONFIGURATION
# ============================================
# Cookie max-age'leri ARTIK ayrı ENV değil — JWT sürelerinden otomatik türetilir
# (AuthCookieWriter jwt.expiration / jwt.refresh.expiration'ı ms'den saniyeye çevirip
# kullanır). Tek kaynak = JWT_EXPIRATION / JWT_REFRESH_EXPIRATION.
cookie.secure=${COOKIE_SECURE:false}

# ============================================
# SPRING ACTUATOR - Performance Monitoring
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.metrics.enabled=true
management.endpoint.health.show-details=when-authorized

# Mail health check devre dışı — SMTP bağlantısı yokken pod crash'i önler
# Mail hesapları DB'de yönetilir (mail_accounts), Spring auto-config SMTP kullanılmaz
management.health.mail.enabled=false

# HTTP Server Request Metrics
management.metrics.enable.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=100ms,500ms,1s,2s,5s

# HikariCP Connection Pool Metrics
management.metrics.enable.hikaricp=true

# JVM Metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

# ============================================
# REDIS CACHE (Tenant-Aware)
# ============================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# ============================================
# DISTRIBUTED TRACING - Zipkin
# ============================================
management.tracing.enabled=${MANAGEMENT_TRACING_ENABLED:false}
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411}/api/v2/spans
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0}
logging.level.zipkin2.reporter=WARN
logging.level.zipkin2=WARN

# logging.level.org.springframework.cache=TRACE

# ============================================
# RABBITMQ CONFIGURATION
# ============================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Broker yokken retry aralığı: 30sn (default 5sn — log gürültüsünü azaltır)
spring.rabbitmq.listener.simple.recovery-interval=30000

# RabbitMQ Management HTTP API (panel admin proxy icin)
rabbitmq.mgmt.url=${RABBITMQ_MGMT_URL:http://localhost:15672/api}
rabbitmq.mgmt.vhost=${RABBITMQ_VHOST:/}
rabbitmq.mgmt.connect-timeout-ms=${RABBITMQ_MGMT_CONNECT_TIMEOUT:2000}
rabbitmq.mgmt.read-timeout-ms=${RABBITMQ_MGMT_READ_TIMEOUT:5000}

# ============================================
# MAIL CONFIGURATION (DB-Based — Mail+Form v2)
# ============================================
# MailSenderAutoConfiguration EllyApplication'da exclude'dur (pod crash onlemi).
# SMTP bilgileri tamamen DB'de (mail_accounts tablosu) tutulur. Her tenant
# birden fazla mail hesabi olusturabilir; form yaratirken senderMailAccountId
# ile hangi hesabin kullanilacagi secilir.
#
# Sifre guvenligi: smtp_password AES-256-CBC ile sifrelenir (AesEncryptor).
# AES_SECRET_KEY tam 32 ASCII karakter olmalidir.

aes.secret-key=${AES_SECRET_KEY:12345678901234567890123456789012}

# ============================================
# THYMELEAF CONFIGURATION
# ============================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=true
# ============================================
# CHAT CONFIGURATION
# ============================================
chat.rate-limit.max-messages-per-second=${CHAT_RATE_LIMIT:10}
chat.typing.ttl-seconds=${CHAT_TYPING_TTL:5}
chat.presence.ttl-seconds=${CHAT_PRESENCE_TTL:300}
chat.message.max-length=${CHAT_MESSAGE_MAX_LENGTH:4000}
